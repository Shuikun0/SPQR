<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPQR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.88em' x='50%25' text-anchor='middle' font-size='76'%3E%F0%9F%8F%9B%3C/text%3E%3C/svg%3E" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f4f4f5;
      --card: #fff;
      --border: #e4e4e7;
      --text: #18181b;
      --muted: #71717a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    #page-main[hidden] {
      display: none !important;
    }
    #page-main {
      padding: 0;
    }
    .app-shell {
      max-width: 56rem;
      margin-left: auto;
      margin-right: auto;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .app-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .app-title {
      font-size: 1.375rem;
      font-weight: 600;
      margin: 0;
      flex-shrink: 0;
    }
    .app-header-spacer {
      flex: 1;
      min-width: 0.5rem;
    }
    .app-header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    #page-scan[hidden] {
      display: none !important;
    }
    #page-scan:not([hidden]) {
      display: flex;
      flex-direction: column;
      padding: 0;
      box-sizing: border-box;
    }
    .scan-subtitle {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 0.75rem;
    }
    .scan-lead {
      margin: 0 0 1rem;
      font-size: 0.8125rem;
      color: var(--muted);
    }
    .scan-preview-shell {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #0a0a0a;
      min-height: min(72vw, 360px);
      position: relative;
      cursor: pointer;
    }
    .scan-preview-shell.is-live {
      background: #000;
      cursor: default;
    }
    #scan-reader {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: min(72vw, 360px);
    }
    #scan-reader video {
      width: 100% !important;
      height: auto !important;
      display: block;
      object-fit: cover;
    }
    .scan-placeholder {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
      font-size: 0.875rem;
      color: #a1a1aa;
      pointer-events: none;
    }
    .scan-preview-shell.is-live .scan-placeholder {
      display: none;
    }
    .scan-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .scan-status {
      font-size: 0.8125rem;
      color: var(--muted);
      min-height: 1.35rem;
      margin: 0.5rem 0 0;
    }
    .scan-result-block {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .scan-result-label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--muted);
    }
    #scanResultOut {
      min-height: 6rem;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.8125rem;
      resize: vertical;
    }
    .scan-result-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    button {
      cursor: pointer;
      font-size: 0.875rem;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: #fff;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.secondary:hover { background: #f4f4f5; }
    button.danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--border);
      padding: 0.35rem 0.6rem;
      font-size: 0.8125rem;
    }
    button.danger:hover { background: #fef2f2; }
    .rows { display: flex; flex-direction: column; gap: 1.25rem; }
    .row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }
    .row-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .row-title { font-size: 0.8125rem; font-weight: 600; color: var(--muted); }
    textarea {
      width: 100%;
      min-height: 5rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.875rem;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      resize: vertical;
    }
    textarea:focus {
      outline: 2px solid rgba(37, 99, 235, 0.35);
      outline-offset: 1px;
    }
    .qr-zone {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .qr-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }
    .qr-item .qr-holder {
      display: inline-block;
      line-height: 0;
      background: #fff;
    }
    .qr-holder.qr-holder--interactive {
      cursor: pointer;
      border-radius: 4px;
      outline: none;
    }
    .qr-holder.qr-holder--interactive:focus-visible {
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.45);
    }
    .qr-page-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.78);
      cursor: pointer;
    }
    .qr-page-overlay[hidden] {
      display: none !important;
    }
    .qr-page-overlay__panel {
      cursor: default;
      text-align: center;
      max-width: 100%;
    }
    .qr-page-overlay__canvas {
      display: block;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .qr-page-overlay__hint {
      margin: 0.75rem 0 0;
      font-size: 0.8125rem;
      color: #e4e4e7;
    }
    .qr-item .qr-holder canvas,
    .qr-item .qr-holder img,
    .qr-item .qr-holder table {
      display: block;
      vertical-align: top;
    }
    .qr-empty {
      font-size: 0.8125rem;
      color: var(--muted);
      padding: 0.5rem 0;
    }
    .error-msg {
      color: var(--danger);
      font-size: 0.8125rem;
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1 class="app-title">🏛️ SPQR</h1>
      <div class="app-header-spacer" aria-hidden="true"></div>
      <div class="app-header-actions">
        <button type="button" class="secondary" id="navToggle">扫码</button>
      </div>
    </header>

    <div id="page-main">
      <div class="rows" id="rows"></div>
    </div>

    <div id="page-scan" hidden>
      <p class="scan-subtitle">扫码</p>
      <p class="scan-lead">点击下方预览区域开始摄像头扫描；识别结果在预览下方，可一键复制。</p>
      <div class="scan-preview-shell" id="scanPreviewShell" role="button" tabindex="0" aria-label="点击开始扫描">
        <p class="scan-placeholder" id="scanPlaceholder">点击此处开始扫描</p>
        <div id="scan-reader"></div>
      </div>
      <p class="scan-status" id="scanStatus"></p>
      <div class="scan-result-block">
        <span class="scan-result-label">识别结果</span>
        <textarea id="scanResultOut" readonly rows="5" spellcheck="false" placeholder="识别成功后显示在此；再次扫描会替换为新的内容"></textarea>
        <div class="scan-result-actions">
          <button type="button" id="scanCopyBtn" class="secondary">复制</button>
        </div>
      </div>
      <div class="scan-actions">
        <button type="button" id="scanStop" class="secondary">停止摄像头</button>
      </div>
    </div>
  </div>

  <div id="qrPageOverlay" class="qr-page-overlay" hidden aria-hidden="true">
    <div class="qr-page-overlay__panel" role="dialog" aria-modal="true" aria-labelledby="qrPageOverlayHint">
      <canvas id="qrPageOverlayCanvas" class="qr-page-overlay__canvas" width="0" height="0"></canvas>
      <p id="qrPageOverlayHint" class="qr-page-overlay__hint">点击空白处或图片关闭</p>
    </div>
  </div>

  <script>
    (function () {
      var rowsEl = document.getElementById("rows");

      function updateRowTitles() {
        var rows = rowsEl.querySelectorAll(".row");
        for (var i = 0; i < rows.length; i++) {
          var title = rows[i].querySelector(".row-title");
          if (title) title.textContent = "第 " + (i + 1) + " 段";
        }
      }

      var html5QrCode = null;
      var scanRunning = false;

      var pageMain = document.getElementById("page-main");
      var pageScan = document.getElementById("page-scan");
      var scanPreviewShell = document.getElementById("scanPreviewShell");
      var qrPageOverlay = document.getElementById("qrPageOverlay");
      var qrPageOverlayCanvas = document.getElementById("qrPageOverlayCanvas");

      function closeQrPageOverlay() {
        if (!qrPageOverlay || qrPageOverlay.hidden) return;
        qrPageOverlay.hidden = true;
        qrPageOverlay.setAttribute("aria-hidden", "true");
        if (qrPageOverlayCanvas) {
          qrPageOverlayCanvas.width = 0;
          qrPageOverlayCanvas.height = 0;
          qrPageOverlayCanvas.removeAttribute("style");
        }
        document.body.style.overflow = "";
      }

      function openQrPageOverlay(holder) {
        if (!holder || !qrPageOverlayCanvas || !qrPageOverlay) return;
        var row = holder.closest(".row");
        var ta = row && row.querySelector("textarea");
        var text = ta ? ta.value : "";
        if (!text.trim()) return;

        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var cssW = Math.floor(Math.min(vw * 0.92, vh * 0.88));
        cssW = Math.max(280, Math.min(cssW, 960));
        var dpr = Math.min(window.devicePixelRatio || 1, 3);
        var pixelW = Math.floor(cssW * dpr);
        pixelW = Math.min(Math.max(pixelW, 200), 2048);

        loadQrLib()
          .then(function (QR) {
            var canvas = qrPageOverlayCanvas;
            function tryPaint(ecc) {
              return QR.toCanvas(canvas, text.trim(), {
                width: pixelW,
                margin: 4,
                errorCorrectionLevel: ecc,
                color: { dark: "#000000", light: "#ffffff" },
              });
            }
            return tryPaint("M").catch(function () {
              return tryPaint("L");
            });
          })
          .then(function () {
            qrPageOverlayCanvas.style.width = cssW + "px";
            qrPageOverlayCanvas.style.height = cssW + "px";
            qrPageOverlayCanvas.style.maxWidth = "none";
            qrPageOverlayCanvas.style.maxHeight = "none";
            qrPageOverlay.hidden = false;
            qrPageOverlay.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
          })
          .catch(function () {});
      }

      if (qrPageOverlay) {
        qrPageOverlay.addEventListener("click", function () {
          closeQrPageOverlay();
        });
      }
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && qrPageOverlay && !qrPageOverlay.hidden) {
          closeQrPageOverlay();
        }
      });

      var qrLibPromise = null;
      function loadQrLib() {
        if (!qrLibPromise) {
          qrLibPromise = import("https://esm.sh/qrcode@1.5.4?bundle").then(function (m) {
            return m.default;
          });
        }
        return qrLibPromise;
      }

      function bindQrOverlayOpen(holder) {
        holder.classList.add("qr-holder--interactive");
        holder.setAttribute("title", "点击放大展示，便于扫描");
        if (holder._spqrOverlayBound) return;
        holder._spqrOverlayBound = true;
        holder.setAttribute("tabindex", "0");
        holder.setAttribute("role", "button");
        holder.addEventListener("click", function () {
          if (holder.querySelector("canvas")) openQrPageOverlay(holder);
        });
        holder.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            if (holder.querySelector("canvas")) openQrPageOverlay(holder);
          }
        });
      }

      function paintQrInHolder(holder, text, eccLevel) {
        holder.innerHTML = "";
        return loadQrLib().then(function (QR) {
          var canvas = document.createElement("canvas");
          return QR.toCanvas(canvas, text, {
            width: 200,
            margin: 2,
            errorCorrectionLevel: eccLevel,
            color: { dark: "#000000", light: "#ffffff" },
          }).then(function () {
            holder.appendChild(canvas);
            bindQrOverlayOpen(holder);
          });
        });
      }

      function stopScanAndReset() {
        var regionEl = document.getElementById("scan-reader");
        var statusEl = document.getElementById("scanStatus");
        if (html5QrCode && scanRunning) {
          html5QrCode.stop().then(
            function () {
              scanRunning = false;
            },
            function () {
              scanRunning = false;
            }
          );
        } else {
          scanRunning = false;
        }
        if (regionEl) regionEl.innerHTML = "";
        if (scanPreviewShell) scanPreviewShell.classList.remove("is-live");
        if (statusEl) statusEl.textContent = "";
      }

      function updateNavButton() {
        var btn = document.getElementById("navToggle");
        if (!btn) return;
        btn.textContent = pageScan.hidden ? "扫码" : "生成";
      }

      function showMain() {
        closeQrPageOverlay();
        stopScanAndReset();
        pageScan.hidden = true;
        pageMain.hidden = false;
        document.title = "SPQR";
        updateNavButton();
      }

      function showScanPage() {
        closeQrPageOverlay();
        pageMain.hidden = true;
        pageScan.hidden = false;
        document.title = "SPQR";
        stopScanAndReset();
        updateNavButton();
      }

      function renderRowQrs(zoneEl, text) {
        zoneEl.innerHTML = "";

        if (!text.trim().length) {
          var empty = document.createElement("p");
          empty.className = "qr-empty";
          empty.textContent = "粘贴内容后将在此显示二维码";
          zoneEl.appendChild(empty);
          return;
        }

        var wrap = document.createElement("div");
        wrap.className = "qr-item";
        var holder = document.createElement("div");
        holder.className = "qr-holder";
        wrap.appendChild(holder);
        zoneEl.appendChild(wrap);

        function fail(msg) {
          zoneEl.innerHTML = "";
          var errP = document.createElement("p");
          errP.className = "error-msg";
          errP.textContent = msg;
          zoneEl.appendChild(errP);
        }

        paintQrInHolder(holder, text, "M")
          .catch(function (e1) {
            var m = e1 && e1.message ? e1.message : String(e1);
            if (/too big|too large|cannot contain|overflow|amount of data/i.test(m)) {
              return paintQrInHolder(holder, text, "L");
            }
            throw e1;
          })
          .catch(function (e) {
            var net =
              e && (e.message === "Failed to fetch" || /network|load failed|import/i.test(String(e.message)));
            fail(
              net
                ? "二维码生成库加载失败，请检查网络后刷新页面。"
                : "生成失败：" +
                    (e && e.message ? e.message : String(e)) +
                    "（单段过长时请拆成多段输入）"
            );
          });
      }

      function refreshAllRows() {
        rowsEl.querySelectorAll(".row").forEach(function (row) {
          var ta = row.querySelector("textarea");
          var zone = row.querySelector(".qr-zone");
          if (ta && zone) renderRowQrs(zone, ta.value);
        });
      }

      function normalizeTrailingRows() {
        var changed = false;
        while (rowsEl.children.length >= 2) {
          var tas = rowsEl.querySelectorAll(".row textarea");
          var n = tas.length;
          if (n >= 2 && tas[n - 1].value.trim() === "" && tas[n - 2].value.trim() === "") {
            rowsEl.lastElementChild.remove();
            changed = true;
          } else {
            break;
          }
        }
        if (!rowsEl.children.length) {
          createRow();
          changed = true;
        }
        tas = rowsEl.querySelectorAll(".row textarea");
        if (tas.length && tas[tas.length - 1].value.trim() !== "") {
          createRow();
          changed = true;
        }
        if (changed) refreshAllRows();
        updateRowTitles();
      }

      function createRow(initialText) {
        var row = document.createElement("div");
        row.className = "row";

        var head = document.createElement("div");
        head.className = "row-head";
        var title = document.createElement("span");
        title.className = "row-title";
        title.textContent = "第 1 段";
        head.appendChild(title);

        var ta = document.createElement("textarea");
        ta.placeholder = "粘贴或输入文本…";
        ta.setAttribute("spellcheck", "false");
        if (typeof initialText === "string" && initialText.length) ta.value = initialText;

        var zone = document.createElement("div");
        zone.className = "qr-zone";
        if (ta.value.length) {
          renderRowQrs(zone, ta.value);
        } else {
          var empty = document.createElement("p");
          empty.className = "qr-empty";
          empty.textContent = "粘贴内容后将在此显示二维码";
          zone.appendChild(empty);
        }

        function onEdit() {
          renderRowQrs(zone, ta.value);
          normalizeTrailingRows();
        }

        ta.addEventListener("input", onEdit);
        ta.addEventListener("paste", function () {
          setTimeout(onEdit, 0);
        });

        row.appendChild(head);
        row.appendChild(ta);
        row.appendChild(zone);
        rowsEl.appendChild(row);
        updateRowTitles();
      }

      function applyScanResult(text) {
        var out = document.getElementById("scanResultOut");
        var status = document.getElementById("scanStatus");
        if (out) {
          out.value = text;
        }
        if (status) status.textContent = "已识别，可复制下方文本。";
      }

      function copyScanResult() {
        var out = document.getElementById("scanResultOut");
        var status = document.getElementById("scanStatus");
        if (!out || !out.value) {
          if (status) status.textContent = "没有可复制的内容。";
          return;
        }
        var t = out.value;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(t).then(
            function () {
              if (status) status.textContent = "已复制到剪贴板。";
            },
            function () {
              fallbackCopyScan(t);
            }
          );
        } else {
          fallbackCopyScan(t);
        }
      }

      function fallbackCopyScan(t) {
        var out = document.getElementById("scanResultOut");
        var status = document.getElementById("scanStatus");
        try {
          out.select();
          out.setSelectionRange(0, t.length);
          document.execCommand("copy");
          if (status) status.textContent = "已复制到剪贴板。";
        } catch (e) {
          if (status) status.textContent = "复制失败，请手动全选复制。";
        }
      }

      function stopScanOnly() {
        if (html5QrCode && scanRunning) {
          html5QrCode.stop().then(
            function () {
              scanRunning = false;
            },
            function () {
              scanRunning = false;
            }
          );
        } else {
          scanRunning = false;
        }
      }

      function scanConfig() {
        return { fps: 12, qrbox: { width: 280, height: 280 } };
      }

      function startScanWithCamera(config) {
        var regionEl = document.getElementById("scan-reader");
        return html5QrCode.start(
          config,
          scanConfig(),
          function (decodedText) {
            function afterStop() {
              scanRunning = false;
              if (regionEl) regionEl.innerHTML = "";
              if (scanPreviewShell) scanPreviewShell.classList.remove("is-live");
              applyScanResult(decodedText);
            }
            if (html5QrCode && scanRunning) {
              html5QrCode.stop().then(afterStop, afterStop);
            } else {
              afterStop();
            }
          },
          function () {}
        );
      }

      function startScanFromUser() {
        if (scanRunning) return;
        var regionEl = document.getElementById("scan-reader");
        var status = document.getElementById("scanStatus");
        if (typeof Html5Qrcode === "undefined") {
          if (status) status.textContent = "扫码库未加载，请联网后刷新。";
          return;
        }
        stopScanOnly();
        if (regionEl) regionEl.innerHTML = "";
        if (scanPreviewShell) scanPreviewShell.classList.remove("is-live");
        if (status) status.textContent = "正在请求摄像头…";

        html5QrCode = new Html5Qrcode("scan-reader");
        startScanWithCamera({ facingMode: "environment" })
          .catch(function () {
            return startScanWithCamera({ facingMode: "user" });
          })
          .then(function () {
            scanRunning = true;
            if (scanPreviewShell) scanPreviewShell.classList.add("is-live");
            if (status) status.textContent = "预览中，对准二维码…";
          })
          .catch(function (e) {
            scanRunning = false;
            if (scanPreviewShell) scanPreviewShell.classList.remove("is-live");
            if (status) status.textContent = (e && e.message) || String(e);
          });
      }

      document.getElementById("navToggle").addEventListener("click", function () {
        if (pageScan.hidden) {
          showScanPage();
        } else {
          showMain();
        }
      });

      scanPreviewShell.addEventListener("click", function () {
        if (scanRunning) return;
        startScanFromUser();
      });

      scanPreviewShell.addEventListener("keydown", function (e) {
        if (scanRunning) return;
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          startScanFromUser();
        }
      });

      document.getElementById("scanCopyBtn").addEventListener("click", copyScanResult);

      document.getElementById("scanStop").addEventListener("click", function () {
        var regionEl = document.getElementById("scan-reader");
        var status = document.getElementById("scanStatus");
        stopScanOnly();
        if (regionEl) regionEl.innerHTML = "";
        if (scanPreviewShell) scanPreviewShell.classList.remove("is-live");
        if (status) status.textContent = "已停止。";
      });

      createRow();
      normalizeTrailingRows();
      updateNavButton();

      requestAnimationFrame(function () {
        var first = rowsEl.querySelector(".row textarea");
        if (first) first.focus();
      });
    })();
  </script>
